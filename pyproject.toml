[project]
name = "carwebscraper"
version = "0.2.0"
description = "Scraper ogłoszeń samochodowych (Otomoto, mobile.de) ze scoringiem rynkowym, enrichmentem, oceną LLM i powiadomieniami Telegram."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"beautifulsoup4>=4.13.0",
	"camoufox[geoip]>=0.4.11",
	"openai>=1.0.0",
	"playwright>=1.53.0",
	"python-telegram-bot>=22.7",
]

[dependency-groups]
dev = [
	"pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
